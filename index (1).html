<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cauca Guardians: The River's Echo | Los Guardianes del Río Cauca</title>
<meta name="description" content="Juego educativo retro RPG sobre la recuperación del río Cauca (Bajo Cauca, Antioquia). Purifica el agua, cura criaturas y rescata la fauna. / Retro educational RPG about restoring the Cauca River.">
<meta property="og:title" content="Cauca Guardians: The River's Echo">
<meta property="og:description" content="Purifica el río Cauca en este juego educativo retro. Bilingüe ES/EN.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b1c26">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🌊</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* ============ TOKENS (tema río Cauca: noche de río, lodo tóxico, agua restaurada) ============ */
:root{
  --bg:#0b1c26;            /* fondo: agua profunda de noche */
  --panel:#122b38;
  --panel2:#0e222d;
  --line:#2a5468;
  --text:#dff2ef;
  --dim:#8fb4b3;
  --toxic:#9fce3d;         /* verde lodo tóxico */
  --water:#3ec6e0;         /* agua purificada */
  --gold:#f2c14e;          /* oro / eco-monedas */
  --danger:#ff6b5e;
  --hp:#ff6b5e;
  --xp:#9b6bff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#08141c; }
}
:root[data-theme="dark"]{ --bg:#08141c; }
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Press Start 2P', monospace;
  display:flex; flex-direction:column; align-items:center;
  overflow:hidden; touch-action:none;
}
button{font-family:inherit; cursor:pointer;}

/* ============ BARRA SUPERIOR ============ */
#topbar{
  width:100%; max-width:980px;
  display:flex; align-items:center; gap:8px;
  padding:8px 10px; font-size:10px;
}
#topbar .title{color:var(--water); font-size:11px; line-height:1.5; flex:1; text-shadow:2px 2px 0 #06323e;}
.chip{
  background:var(--panel); border:2px solid var(--line); border-radius:4px;
  padding:7px 9px; font-size:10px; color:var(--text); white-space:nowrap;
}
button.chip:hover{border-color:var(--water); color:var(--water);}
#btnLang{border-color:var(--gold); color:var(--gold);}

/* ============ BARRA DE OBJETIVO (claridad de misión) ============ */
#objBar{
  width:100%; max-width:980px; box-sizing:border-box;
  background:var(--panel2); border:2px solid var(--gold); border-radius:4px;
  padding:7px 10px; font-size:9px; color:var(--gold); line-height:1.6;
  margin:0 0 6px 0;
}

/* ============ LIENZO DEL JUEGO ============ */
#gamewrap{position:relative; width:100%; max-width:980px; flex:1; display:flex; align-items:center; justify-content:center;}
#game{width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
#game canvas{border:3px solid var(--line); border-radius:6px; image-rendering:pixelated;}

/* ============ HUD INFERIOR ============ */
#hud{
  width:100%; max-width:980px;
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding:8px 10px 12px; font-size:9px;
}
.bar{position:relative; height:16px; background:var(--panel2); border:2px solid var(--line); border-radius:3px; overflow:hidden;}
.bar .fill{position:absolute; inset:0; width:0%; transition:width .18s;}
.bar .lbl{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#fff; text-shadow:1px 1px 0 #000;}
#hpBar{flex:1.2; min-width:130px;} #hpBar .fill{background:var(--hp);}
#xpBar{flex:1.2; min-width:130px;} #xpBar .fill{background:var(--xp);}
#toxBar{flex:1; min-width:110px; display:none;} #toxBar .fill{background:var(--toxic);}
.stat{white-space:nowrap; color:var(--dim);}
.stat b{color:var(--text);}

/* ============ MODALES ============ */
.overlay{
  position:fixed; inset:0; background:rgba(4,12,17,.82);
  display:none; align-items:center; justify-content:center; z-index:60; padding:14px;
}
.overlay.show{display:flex;}
.panel{
  background:var(--panel); border:3px solid var(--line); border-radius:8px;
  max-width:640px; width:100%; max-height:92vh; overflow-y:auto;
  padding:20px; font-size:10px; line-height:1.9;
}
.panel h2{font-size:13px; color:var(--water); margin-bottom:12px; line-height:1.6;}
.panel h2.gold{color:var(--gold);}
.panel p{margin-bottom:12px; color:var(--text);}
.panel .dim{color:var(--dim);}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
.btn{
  background:var(--panel2); border:2px solid var(--water); color:var(--water);
  padding:11px 14px; border-radius:5px; font-size:10px;
}
.btn:hover{background:var(--water); color:#06222b;}
.btn.gold{border-color:var(--gold); color:var(--gold);}
.btn.gold:hover{background:var(--gold); color:#3b2a05;}
.btn:disabled{opacity:.35; cursor:default;}
.btn:disabled:hover{background:var(--panel2); color:var(--water);}

/* Tutorial */
#tutorialModal .panel{border-color:var(--gold);}
.tutStep{display:flex; gap:10px; align-items:flex-start; margin-bottom:12px;}
.tutStep .num{
  flex:0 0 auto; width:20px; height:20px; border-radius:50%;
  background:var(--gold); color:#3b2a05; font-size:9px;
  display:flex; align-items:center; justify-content:center;
}
.tutStep .txt{flex:1; font-size:10px; line-height:1.7; color:var(--text);}

/* Eco-Insight */
#insightModal .panel{border-color:var(--toxic);}
#insightModal h2{color:var(--toxic);}
.insightAction{border-left:4px solid var(--gold); padding:8px 10px; background:var(--panel2); color:var(--gold); margin-bottom:10px;}

/* Tienda */
.shopItem{
  display:flex; align-items:center; gap:10px; background:var(--panel2);
  border:2px solid var(--line); border-radius:5px; padding:10px; margin-bottom:8px;
}
.shopItem .ico{font-size:20px; font-family:sans-serif;}
.shopItem .info{flex:1;}
.shopItem .info .nm{color:var(--text); margin-bottom:4px;}
.shopItem .info .ds{color:var(--dim); font-size:8px; line-height:1.7;}
.shopItem .buy{min-width:86px; text-align:center;}

/* Eco-Dex */
.dexItem{display:flex; gap:10px; align-items:center; background:var(--panel2); border:2px solid var(--line); border-radius:5px; padding:9px; margin-bottom:7px;}
.dexItem .ico{font-size:22px; font-family:sans-serif; filter:grayscale(1) brightness(.4);}
.dexItem.found .ico{filter:none;}
.dexItem .nm{margin-bottom:4px;}
.dexItem .fact{font-size:8px; color:var(--dim); line-height:1.7;}
.dexItem.found{border-color:var(--water);}

/* Aviso de jefe */
#bossBanner{
  position:fixed; top:18%; left:50%; transform:translateX(-50%);
  background:var(--panel); border:3px solid var(--danger); border-radius:8px;
  padding:16px 22px; z-index:55; display:none; text-align:center; font-size:12px;
  color:var(--danger); line-height:1.8;
}
#bossBanner small{display:block; color:var(--dim); font-size:9px; margin-top:6px;}

/* Insignias */
.badge{display:inline-block; font-size:26px; font-family:sans-serif; margin:0 4px;}

/* Controles táctiles */
#touch{position:fixed; inset:0; z-index:40; display:none; pointer-events:none;}
#joy{position:absolute; left:4vw; bottom:12vh; width:120px; height:120px; border:2px solid var(--line); border-radius:50%; background:rgba(18,43,56,.35); pointer-events:auto;}
#joyKnob{position:absolute; left:38px; top:38px; width:44px; height:44px; border-radius:50%; background:rgba(62,198,224,.55);}
.tbtn{
  position:absolute; width:64px; height:64px; border-radius:50%;
  border:2px solid var(--line); background:rgba(18,43,56,.55); color:var(--text);
  font-size:8px; pointer-events:auto;
}
#tFire{right:5vw; bottom:12vh; border-color:var(--water); color:var(--water);}
#tCarb{right:22vw; bottom:10vh; border-color:var(--toxic); color:var(--toxic);}
#tSeed{right:14vw; bottom:24vh; border-color:var(--gold); color:var(--gold);}
@media (pointer:coarse){ #touch{display:block;} }

@media (max-width:700px){
  #topbar .title{font-size:8px;}
  .chip{padding:6px 7px; font-size:8px;}
  #hud{font-size:8px;}
}

/* ============ CAPA RETRO RPG ============ */
body{
  background:
    radial-gradient(circle at 50% 120%, #1c5a6e 0, transparent 55%),
    repeating-linear-gradient(0deg, rgba(62,198,224,.05) 0 2px, transparent 2px 6px),
    linear-gradient(#050d14, #0b1c26 60%, #0f3b4a);
  background-attachment:fixed;
}
#fx{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
#fx i{position:absolute; bottom:-12px; width:6px; height:6px; background:var(--water); opacity:.5;
  box-shadow:0 0 6px var(--water); animation:rise linear infinite;}
#fx i.f{background:var(--gold); box-shadow:0 0 8px var(--gold); animation-name:drift;}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px); opacity:0;}}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.2} 50%{transform:translate(18px,-30vh);opacity:.9}}
#topbar,#objBar,#gamewrap,#hud{position:relative; z-index:1;}
#topbar{background:var(--panel); border:3px solid var(--line); border-radius:4px; margin-top:6px;
  box-shadow:inset 0 0 0 2px #06141c, 4px 4px 0 #04101a;}
#topbar .title{animation:glow 2.4s ease-in-out infinite;}
@keyframes glow{50%{text-shadow:2px 2px 0 #06323e,0 0 12px var(--water);}}
.chip{box-shadow:3px 3px 0 #04101a; transition:transform .08s;}
button.chip:hover,.btn:hover{transform:translate(-1px,-2px);}
button.chip:active,.btn:active{transform:translate(2px,2px); box-shadow:none;}
#objBar{box-shadow:3px 3px 0 #04101a; background:linear-gradient(90deg,#1a2a18,var(--panel2));}
#gamewrap::after{content:""; position:absolute; inset:0; pointer-events:none; border-radius:6px;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
             radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.45) 100%);}
#game canvas{box-shadow:0 0 0 3px #06141c, 0 0 28px rgba(62,198,224,.35), 6px 6px 0 #04101a;}
.bar{box-shadow:2px 2px 0 #04101a;}
.bar .fill{background-image:linear-gradient(rgba(255,255,255,.28),transparent 55%);}
.panel{border:4px solid var(--line); border-radius:0; box-shadow:inset 0 0 0 3px #06141c, 0 0 0 4px #06141c, 8px 8px 0 rgba(0,0,0,.5);
  background:linear-gradient(#153545,#102a37); animation:pop .22s steps(4);}
@keyframes pop{from{transform:scale(.85); opacity:0}}
.btn{border-radius:0; box-shadow:4px 4px 0 #04101a; transition:transform .08s;}
#menuModal{background:radial-gradient(circle at 50% 30%, rgba(20,80,100,.85), rgba(3,9,14,.95));}
#menuModal h2{font-size:16px; text-align:center; color:var(--gold); text-shadow:3px 3px 0 #5a3d05,0 0 16px rgba(242,193,78,.6);
  animation:bob 2s ease-in-out infinite;}
#menuModal h2::before{content:"🌊 🐊 🌿"; display:block; font-size:22px; margin-bottom:8px; letter-spacing:6px;}
@keyframes bob{50%{transform:translateY(-5px);}}
#menuModal #btnStart{animation:blink 1s steps(2) infinite; font-size:12px; padding:14px 18px;}
@keyframes blink{50%{background:var(--water); color:#06222b;}}
.shopItem,.dexItem{border-radius:0; transition:transform .1s;}
.shopItem:hover,.dexItem:hover{transform:translateX(4px); border-color:var(--gold);}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>

<div id="fx"></div>
<div id="topbar">
  <div class="title">CAUCA GUARDIANS<br><span id="lvlName" style="color:var(--dim);font-size:8px;"></span></div>
  <div class="chip">🪙 <span id="uiCoins">0</span></div>
  <button class="chip" id="btnDex" data-i18n="ui.dex">Eco-Dex</button>

</div>

<div id="objBar">🎯 <span id="uiGoal"></span></div>

</div>

<!-- Menú principal -->
<div class="overlay show" id="menuModal">

    </div>
  </div>
</div>

<!-- Tutorial de nivel (aparece la primera vez que se entra a cada nivel) -->
<div class="overlay" id="tutorialModal">
  <div class="panel">
    <h2 class="gold" id="tutTitle"></h2>
    <div id="tutSteps"></div>
    <div class="btnrow"><button class="btn gold" id="btnTutOk" data-i18n="tut.ok">GOT IT — LET'S GO</button></div>
  </div>
</div>

<!-- Eco-Insight -->
<div class="overlay" id="insightModal">
  <div class="panel">
    <h2>⚡ <span data-i18n="ins.title">ECO-INSIGHT UNLOCKED</span></h2>
    <p id="insTitle" style="color:var(--gold)"></p>
    <p id="insBody"></p>
    <div class="insightAction" id="insAction"></div>
    <div class="btnrow"><button class="btn" id="btnInsOk" data-i18n="ins.ok">GOT IT — BACK TO ACTION</button></div>
  </div>
</div>

<!-- Tienda -->
<div class="overlay" id="shopModal">
  <div class="panel">
    <h2 class="gold">🛒 <span data-i18n="shop.title">THE RECYCLER'S HUB</span></h2>

    <div id="shopList"></div>
    <div class="btnrow"><button class="btn" id="btnShopNext" data-i18n="shop.next">NEXT LEVEL ➤</button></div>
  </div>
</div>

<!-- Resultados de nivel -->
<div class="overlay" id="resultsModal">
  <div class="panel" style="text-align:center">
    <h2 data-i18n="res.title">AREA RESTORED!</h2>
    <div id="resBadge" class="badge">🥉</div>
    <p id="resText"></p>
    <div class="btnrow" style="justify-content:center"><button class="btn gold" id="btnResOk" data-i18n="res.ok">VISIT THE SHOP</button></div>
  </div>
</div>

<!-- Derrota -->
<div class="overlay" id="faintModal">
  <div class="panel" style="text-align:center">
    <h2 style="color:var(--danger)" data-i18n="faint.title">YOU FAINTED!</h2>
    <p data-i18n="faint.body"></p>
    <div class="btnrow" style="justify-content:center"><button class="btn" id="btnFaintOk" data-i18n="faint.ok">GET UP AND FIGHT</button></div>
  </div>
</div>

<!-- Eco-Dex -->
<div class="overlay" id="dexModal">
  <div class="panel">
    <h2>📖 ECO-DEX</h2>
    <p class="dim" data-i18n="dex.hint"></p>
    <div id="dexList"></div>
    <div class="btnrow"><button class="btn" id="btnDexClose" data-i18n="ui.close">CLOSE</button></div>
  </div>
</div>

<!-- Victoria final -->
<div class="overlay" id="victoryModal">
  <div class="panel" style="text-align:center">
    <h2 class="gold" data-i18n="vic.title">THE RIVER BREATHES AGAIN!</h2>

    <p class="dim" data-i18n="vic.msg"></p>
    <div class="btnrow" style="justify-content:center"><button class="btn" id="btnReplay" data-i18n="vic.replay">PLAY AGAIN</button></div>
  </div>
</div>

<div id="bossBanner"></div>

let LANG = "en";
function t(id){ return (DICT[LANG] && DICT[LANG][id]) || DICT.en[id] || id; }
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  const gs = window.GS; // escena activa
  document.getElementById("lvlName").textContent = gs ? t("lvl."+gs.levelN) : "";
  buildShop(); buildDex(); updateHUD();
}

/* ============ 2. ESTADO GLOBAL Y GUARDADO ============ */
const DEFAULT_STATE = ()=>({
  coins:0, plvl:1, xp:0,
  up:{speed:0, range:0, resist:0, maxhp:0},
  inv:{carbon:1, seeds:2},
  insightsSeen:[], dex:{}, badges:{},   // badges[levelN] = "gold"|"silver"|"bronze"
  tutSeen:{},                           // tutSeen[levelN] = true una vez mostrado
  currentLevel:1, lang:"en"
});
let S = DEFAULT_STATE();

function saveGame(){
  try{ S.lang = LANG; localStorage.setItem("caucaGuardiansSave", JSON.stringify(S)); }catch(e){}
}
function loadGame(){
  try{
    const raw = localStorage.getItem("caucaGuardiansSave");
    if(!raw) return false;
    const d = JSON.parse(raw);
    S = Object.assign(DEFAULT_STATE(), d);
    S.up = Object.assign({speed:0,range:0,resist:0,maxhp:0}, d.up||{});
    S.inv = Object.assign({carbon:1,seeds:2}, d.inv||{});
    if(d.lang) LANG = d.lang;
    return true;
  }catch(e){ return false; }
}

/* Valores derivados de mejoras */
function maxHP(){ return 100 + S.up.maxhp*20; }
function moveSpeed(){ return 170 * (1 + S.up.speed*0.10); }
function netRange(){ return 1 + S.up.range*0.12; }
function resistMult(){ return Math.max(0.35, 1 - S.up.resist*0.08); }
function xpNeed(){ return 40 + (S.plvl-1)*35; }
function netDmg(){ return 10 + S.plvl*2; }

/* ============ 3. AYUDANTES DE INTERFAZ (HUD, modales, toasts) ============ */
const $ = id => document.getElementById(id);
window.gamePaused = true;

function setPaused(p){
  window.gamePaused = p;
  const gs = window.GS;
  if(gs && gs.physics){ p ? gs.physics.pause() : gs.physics.resume(); }
}
function openModal(id){ $(id).classList.add("show"); setPaused(true); }
function closeModal(id){
  $(id).classList.remove("show");
  const anyOpen = document.querySelector(".overlay.show");
  if(!anyOpen) setPaused(false);
}

function updateHUD(){
  const gs = window.GS;
  $("uiCoins").textContent = S.coins;
  $("uiSeeds").textContent = S.inv.seeds;
  $("uiCarbon").textContent = S.inv.carbon;
  $("uiPLvl").textContent = S.plvl;
  const hpF = $("hpBar").querySelector(".fill");
  const hp = gs ? gs.hp : maxHP();
  hpF.style.width = Math.max(0, hp/maxHP()*100) + "%";
  $("hpBar").querySelector(".lbl").textContent = "HP " + Math.ceil(Math.max(0,hp)) + "/" + maxHP();
  const xpF = $("xpBar").querySelector(".fill");
  xpF.style.width = Math.min(100, S.xp/xpNeed()*100) + "%";
  $("xpBar").querySelector(".lbl").textContent = "XP " + S.xp + "/" + xpNeed();
  if(gs){
    $("uiClean").textContent = Math.floor(gs.cleanupPct()) + "%";
    const goalEl = $("uiGoal");
    if(goalEl){
      if(gs.bossDefeated) goalEl.textContent = t("obj.done");
      else if(gs.bossSpawned) goalEl.textContent = t("obj.boss");
      else goalEl.textContent = t("obj.clean") + " " + Math.floor(gs.cleanupPct()) + "% / " + (gs.L.bossPct || 60) + "%";
    }
    if(gs.levelN === 3){
      $("toxBar").style.display = "block";
      $("toxBar").querySelector(".fill").style.width = gs.toxicity + "%";
    } else $("toxBar").style.display = "none";
  }
}

let toastTimer = null;
function toast(msg){
  const b = $("bossBanner");
  b.innerHTML = msg; b.style.display = "block"; b.style.borderColor = "var(--gold)"; b.style.color = "var(--text)";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ b.style.display = "none"; }, 2200);
}
function bossBanner(n){
  const b = $("bossBanner");
  b.innerHTML = t("boss.incoming") + "<br>" + t("boss."+n) + "<small>" + t("boss."+n+"s") + "</small>";
  b.style.display = "block"; b.style.borderColor = "var(--danger)"; b.style.color = "var(--danger)";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ b.style.display = "none"; }, 3500);
}

/* ============ 3b. TUTORIAL POR NIVEL (claridad de mecánicas) ============ */
/* Se muestra automáticamente la primera vez que el jugador entra a cada nivel,
   con pasos numerados y concretos de qué hacer (no es solo texto de ambientación). */
function showTutorial(levelN){
  $("tutTitle").textContent = t("tut."+levelN+"t");
  const steps = ["a","b","c","d"].map(k=>t("tut."+levelN+k));
  $("tutSteps").innerHTML = steps.map((s,i)=>
    `<div class="tutStep"><div class="num">${i+1}</div><div class="txt">${s}</div></div>`
  ).join("");
  S.tutSeen[levelN] = true; saveGame();
  openModal("tutorialModal");
}

/* ============ 4. SISTEMA EDUCATIVO: ECO-INSIGHTS ============ */
/* Se disparan SOLO en OnLevelUp y OnBossDefeat: pausan la física y muestran el modal. */
const INSIGHT_IDS = [1,2,3,4,5];
window.insQueue = [];
function renderInsight(n){
  $("insTitle").textContent = t("ins."+n+"t");
  $("insBody").textContent = t("ins."+n+"b");
  $("insAction").textContent = t("ins."+n+"a");
  if(!S.insightsSeen.includes(n)) S.insightsSeen.push(n);
  saveGame();
}
function showInsight(n){
  // si el modal ya está abierto (p. ej. level-up durante la derrota del jefe), encolar
  if($("insightModal").classList.contains("show")){ window.insQueue.push(n); return; }
  renderInsight(n);
  openModal("insightModal");
}
function nextUnseenInsight(){
  return INSIGHT_IDS.find(n => !S.insightsSeen.includes(n)) || null;
}
/* Evento OnLevelUp: sube nivel, pausa y entrega conocimiento como recompensa */
function onLevelUp(){
  S.plvl++;
  const gs = window.GS;
  if(gs){ gs.hp = maxHP(); gs.levelUpFX(); }   // recompensa: vida completa + efecto visual
  const n = nextUnseenInsight();
  if(n) showInsight(n);
  else toast("⭐ LEVEL UP! +" + netDmg() + " ATK");
  updateHUD(); saveGame();
}
function gainXP(n){
  S.xp += n;
  if(S.xp >= xpNeed()){ S.xp -= xpNeed(); onLevelUp(); }
  updateHUD();
}

const SHOP_ITEMS = [
  {id:"speed",  ico:"🥾", stat:true,  base:20, max:5},
  {id:"range",  ico:"🕸️", stat:true,  base:25, max:5},
  {id:"resist", ico:"🦺", stat:true,  base:25, max:5},
  {id:"maxhp",  ico:"💙", stat:true,  base:30, max:5},
  {id:"carbon", ico:"🧪", stat:false, base:15},
  {id:"seeds",  ico:"🌱", stat:false, base:12},
  {id:"heal",   ico:"🍵", stat:false, base:10},
];
function itemPrice(it){
  if(!it.stat) return it.base;
  return Math.floor(it.base * Math.pow(1.6, S.up[it.id]));
}
function buildShop(){
  const list = $("shopList"); if(!list) return;
  list.innerHTML = "";
  $("shopCoins").textContent = S.coins;
  SHOP_ITEMS.forEach(it=>{
    const lvl = it.stat ? S.up[it.id] : null;
    const maxed = it.stat && lvl >= it.max;
    const price = itemPrice(it);
    const div = document.createElement("div");
    div.className = "shopItem";
    div.innerHTML =
      `<div class="ico">${it.ico}</div>
       <div class="info">
         <div class="nm">${t("shop."+it.id)}${it.stat ? " <span style='color:var(--water)'>Lv."+lvl+"/"+it.max+"</span>" : ""}</div>
         <div class="ds">${t("shop."+it.id+"D")}</div>
       </div>
       <button class="btn gold buy" ${maxed || S.coins < price ? "disabled":""}>
         ${maxed ? t("shop.max") : "🪙 "+price}
       </button>`;
    div.querySelector("button").onclick = ()=>{
      if(maxed || S.coins < price) return;
      S.coins -= price;
      if(it.stat) S.up[it.id]++;
      else if(it.id==="carbon") S.inv.carbon += 2;
      else if(it.id==="seeds") S.inv.seeds += 2;
      else if(it.id==="heal" && window.GS) window.GS.hp = maxHP();
      saveGame(); buildShop(); updateHUD();
    };
    list.appendChild(div);
  });
}

    list.appendChild(div);
  });
}

const TILE = 32, GW = 44, GH = 32;   // tamaño de tile y dimensiones del mapa

class Boot extends Phaser.Scene{
  constructor(){ super("Boot"); }
  create(){
    const g = this.add.graphics();
    const mk = (key)=>{ g.generateTexture(key, TILE, TILE); g.clear(); };
    const px = (c,x,y,w,h)=>{ g.fillStyle(c,1); g.fillRect(x,y,w,h); };

    /* --- HELPERS DE DIBUJO (formas redondeadas -> look "juego 2D" y personajes humanos) --- */
    const dot  = (c,x,y,r)=>{ g.fillStyle(c,1); g.fillCircle(x,y,r); };
    const oval = (c,x,y,w,h)=>{ g.fillStyle(c,1); g.fillEllipse(x,y,w,h); };
    const rr   = (c,x,y,w,h,rad)=>{ g.fillStyle(c,1); g.fillRoundedRect(x,y,w,h,rad); };
    const tri  = (c,x1,y1,x2,y2,x3,y3)=>{ g.fillStyle(c,1); g.fillTriangle(x1,y1,x2,y2,x3,y3); };
    const mkP  = (key,w,h)=>{ g.generateTexture(key,w,h); g.clear(); };

    /* --- TILES (con sombreado suave para dar profundidad tipo videojuego 2D) --- */
    const tile = (base, accents, key)=>{
      px(base,0,0,32,32);
      accents.forEach(a=>px(a[0],a[1],a[2],a[3],a[4]));
      g.fillStyle(0xffffff,0.07); g.fillEllipse(10,8,18,9);     // brillo superior
      g.fillStyle(0x000000,0.15); g.fillEllipse(20,26,22,10);   // sombra inferior
      mk(key);

/* =====================================================================
   8. DEFINICIÓN DE TILES Y GENERACIÓN DE NIVELES
   ===================================================================== */
const TT = {   // propiedades por tipo de tile
  waterdeep:{tex:"t_waterdeep", walk:false, toxic:true,  pure:"cleandeep"},
  waterdeco:{tex:"t_waterdeep", walk:false, toxic:true,  pure:"cleandeep", nocount:true},
  cleandeep:{tex:"t_cleandeep", walk:false},
  dock:     {tex:"t_dock",      walk:true},
  decay:    {tex:"t_decay",     walk:true,  sink:true},
  sludge:   {tex:"t_sludge",    walk:true,  toxic:true,  pure:"grass"},
  grass:    {tex:"t_grass",     walk:true},
  mud:      {tex:"t_mud",       walk:true},
  mudflow:  {tex:"t_mudflow",   walk:false, bridge:true},
  bridge:   {tex:"t_bridge",    walk:true},
  toxwater: {tex:"t_toxwater",  walk:true,  toxic:true,  pure:"cleanwater", toxup:true},
  cleanwater:{tex:"t_cleanwater",walk:true},
  mercury:  {tex:"t_mercury",   walk:true,  toxic:true,  pure:"cleanwater", lethal:true},
  rock:     {tex:"t_rock",      walk:false},
  stump:    {tex:"t_stump",     walk:false, toxic:true,  pure:"tree"},
  tree:     {tex:"t_tree",      walk:false},
};

function genLevel(n, rng){
  const grid = [];
  const R = (a,b)=> a + Math.floor(rng()* (b-a+1));
  for(let y=0;y<GH;y++){ grid.push(new Array(GW).fill("dock")); }
  const set=(x,y,v)=>{ if(x>=0&&x<GW&&y>=0&&y<GH) grid[y][x]=v; };
  const inBorder=(x,y,th)=> x<th||y<th||x>=GW-th||y>=GH-th;

  if(n===1){ /* EL PUERTO: muelles sobre agua tóxica, tablones podridos */
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
      if(inBorder(x,y,3)) grid[y][x]="waterdeco";      // anillos 0-2: decorativo, no cuenta para limpieza
      else if(inBorder(x,y,4)) grid[y][x]="waterdeep"; // anillo 3: sí cuenta
    }
    for(let y=4;y<GH-4;y++){ set(15,y,"waterdeep"); set(16,y,"waterdeep"); }   // canal vertical
    for(let x=4;x<GW-4;x++){ set(x,16,"waterdeep"); set(x,17,"waterdeep"); }   // canal horizontal
    for(let y=10;y<=11;y++){ set(15,y,"dock"); set(16,y,"dock"); }             // cruces
    for(let x=26;x<=27;x++){ set(x,16,"dock"); set(x,17,"dock"); }
    for(let y=4;y<GH-4;y++)for(let x=4;x<GW-4;x++){
      if(grid[y][x]!=="dock") continue;
      if(Math.abs(x-6)<3 && Math.abs(y-6)<3) continue;         // zona de aparición segura
      const r = rng();
      if(r<0.10) grid[y][x]="decay";
      else if(r<0.24) grid[y][x]="sludge";
    }
    return {grid, spawn:[6,6], boss:[22,10], trash:26, fog:false,
            enemies:[{tex:"e_slime", hp:26, spd:62, dmg:12, cap:6, slow:false}],
            animals:["boca","heron","turtle"]};
  }

  if(n===2){ /* EL LODO DORADO: tierra talada, ríos de lodo, niebla */
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
      grid[y][x] = inBorder(x,y,2) ? "rock" : "mud";
    }
    [[12,13],[24,25],[34,35]].forEach(cols=>{
      for(let y=2;y<GH-2;y++){ set(cols[0],y,"mudflow"); set(cols[1],y,"mudflow"); }
    });
    for(let y=2;y<GH-2;y++)for(let x=2;x<GW-2;x++){
      if(grid[y][x]!=="mud") continue;
      if(Math.abs(x-5)<3 && Math.abs(y-16)<3) continue;
      const r = rng();
      if(r<0.10) grid[y][x]="stump";
      else if(r<0.20) grid[y][x]="sludge";
    }
    for(let y=13;y<=19;y++)for(let x=37;x<=42;x++) if(grid[y][x]==="stump") grid[y][x]="mud"; // arena del jefe
    return {grid, spawn:[5,16], boss:[39,16], trash:18, fog:true,
            enemies:[{tex:"e_mudel", hp:38, spd:52, dmg:14, cap:6, slow:true, dropSeed:0.35}],
            animals:["heron","turtle","otter"]};
  }

  /* NIVEL 3 — LAS PROFUNDIDADES: agua tóxica caminable, charcos de azogue letales */
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    grid[y][x] = inBorder(x,y,2) ? "rock" : "toxwater";
  }
  for(let i=0;i<26;i++){ const x=R(3,GW-4), y=R(3,GH-4); set(x,y,"rock"); }
  for(let i=0;i<12;i++){
    const x=R(4,GW-6), y=R(4,GH-6);
    if(Math.abs(x-5)<4 && Math.abs(y-5)<4) continue;
    if(Math.abs(x-22)<4 && Math.abs(y-16)<4) continue;
    set(x,y,"mercury"); set(x+1,y,"mercury"); set(x,y+1,"mercury"); set(x+1,y+1,"mercury");
  }
  for(let y=4;y<=6;y++)for(let x=4;x<=6;x++) set(x,y,"cleanwater");   // aparición segura
  return {grid, spawn:[5,5], boss:[22,16], trash:16, fog:false, bossPct:45,
          enemies:[{tex:"e_boca", hp:22, spd:118, dmg:10, cap:5, slow:false},
                   {tex:"e_phantom", hp:34, spd:0, dmg:16, cap:3, slow:false, tele:true}],
          animals:["boca","manatee","otter"]};
}

/* =====================================================================
   9. ESCENA PRINCIPAL DEL JUEGO
   ===================================================================== */
class World extends Phaser.Scene{
  constructor(){ super("World"); }
  init(data){ this.levelN = data.level || 1; }

  create(){
    window.GS = this;
    const rng = Phaser.Math.RND.frac.bind(Phaser.Math.RND);
    this.L = genLevel(this.levelN, rng);
    this.grid = this.L.grid;
    this.gt = 0;                       // reloj del juego (solo avanza sin pausa)
    this.hp = maxHP();
    this.toxicity = 0;
    this.slowUntil = 0; this.mercHitAt = -9; this.nextShot = 0; this.nextHudAt = 0;
    this.decayState = {};              // estado de tablones podridos {"x,y":{t,sunkUntil}}
    this.bossSpawned = false; this.bossDefeated = false; this.boss = null;
    this.pr = this.levelN===3 ? 2 : 1;  // radio de purificación (nivel 3 tiene mucha más área tóxica)
    this.cleanupDone = 0; this.cleanupTotal = 0;
    this.activeAnimals = 0; this.facing = {x:1, y:0};

    /* ---- dibujar el mapa como cuadrícula de imágenes ---- */
    this.tileImgs = [];
    for(let y=0;y<GH;y++){
      this.tileImgs.push([]);
      for(let x=0;x<GW;x++){
        const type = this.grid[y][x];
        if(TT[type].toxic && !TT[type].nocount) this.cleanupTotal++;
        const img = this.add.image(x*TILE+16, y*TILE+16, TT[type].tex).setDepth(0);
        this.tileImgs[y].push(img);
      }
    }
    this.physics.world.setBounds(0,0,GW*TILE,GH*TILE);

    /* ---- grupos ---- */
    this.projectiles = this.physics.add.group();
    this.enemyShots  = this.physics.add.group();
    this.enemies     = this.physics.add.group();
    this.trashGroup  = this.physics.add.group();
    this.animalGroup = this.physics.add.group();

    /* ---- jugador ---- */
    const [sx,sy] = this.L.spawn;
    this.player = this.physics.add.sprite(sx*TILE+16, sy*TILE+16, "p_player").setDepth(10);
    this.player.body.setSize(20,20);
    this.lastSafe = {x:this.player.x, y:this.player.y};
    this.cameras.main.startFollow(this.player, true, 0.12, 0.12);
    this.cameras.main.setBounds(0,0,GW*TILE,GH*TILE);

    /* ---- basura flotante ---- */
    const TRASH_EMOJI = ["🥤","🛍️","🥫","👟","📦"];
    this.cleanupTotal += this.L.trash;
    let placed = 0, guard = 0;
    while(placed < this.L.trash && guard++ < 2000){
      const x = Phaser.Math.Between(3, GW-4), y = Phaser.Math.Between(3, GH-4);
      const tp = this.grid[y][x];
      if(!TT[tp].walk && tp!=="waterdeep" && tp!=="waterdeco") continue;
      if(Phaser.Math.Distance.Between(x*TILE, y*TILE, this.player.x, this.player.y) < 90) continue;
      const tr = this.add.text(x*TILE+16, y*TILE+16, Phaser.Math.RND.pick(TRASH_EMOJI), {fontSize:"20px"}).setOrigin(0.5).setDepth(5);
      this.physics.add.existing(tr);
      this.trashGroup.add(tr);
      this.tweens.add({targets:tr, y:tr.y-5, duration:900, yoyo:true, repeat:-1, ease:"Sine.inOut"});
      placed++;
    }

    /* ---- niebla densa (Nivel 2) ---- */
    if(this.L.fog){
      this.fogRT = this.add.renderTexture(0,0, this.scale.width, this.scale.height)
        .setOrigin(0).setScrollFactor(0).setDepth(50);
    }

    /* ---- colisiones / solapamientos ---- */
    this.physics.add.overlap(this.projectiles, this.enemies, (p,e)=>this.hitEnemy(p,e));
    this.physics.add.overlap(this.projectiles, this.trashGroup, (p,tr)=>this.collectTrash(tr));
    this.physics.add.overlap(this.player, this.trashGroup, (pl,tr)=>this.collectTrash(tr));
    this.physics.add.overlap(this.player, this.enemies, (pl,e)=>this.enemyTouch(e));
    this.physics.add.overlap(this.player, this.enemyShots, (pl,s)=>{ s.destroy(); this.damagePlayer(s.dmg||12); });
    this.physics.add.overlap(this.player, this.animalGroup, (pl,a)=>this.rescueAnimal(a));

    /* ---- controles ---- */
    this.keys = this.input.keyboard.addKeys("W,A,S,D,UP,DOWN,LEFT,RIGHT,SPACE,E,F");
    this.input.keyboard.on("keydown-E", ()=>{ if(!window.gamePaused) this.carbonBurst(); });
    this.input.keyboard.on("keydown-F", ()=>{ if(!window.gamePaused) this.plantSeed(); });
    this.input.on("pointerdown", (ptr)=>{ if(!window.gamePaused) this.shootAt(ptr.worldX, ptr.worldY); });

    $("lvlName").textContent = t("lvl."+this.levelN);
    updateHUD();
    if(!S.tutSeen[this.levelN]) this.time.delayedCall(60, ()=> showTutorial(this.levelN));
  }

  /* ===================== BUCLE PRINCIPAL ===================== */
  update(_, deltaMS){
    if(window.gamePaused) return;
    const dt = Math.min(deltaMS/1000, 0.05);
    this.gt += dt;

    this.movePlayer(dt);
    this.tileEffects(dt);
    this.updateEnemies(dt);
    this.updateProjectiles();
    this.updateBoss(dt);
    this.spawnLogic();

    // disparo continuo: mantener clic o ESPACIO
    const ptr = this.input.activePointer;
    if(ptr.isDown && this.gt > this.nextShot) this.shootAt(ptr.worldX, ptr.worldY);
    if(this.keys.SPACE.isDown && this.gt > this.nextShot)
      this.shootAt(this.player.x + this.facing.x*100, this.player.y + this.facing.y*100);

    // niebla que sigue al jugador
    if(this.fogRT){
      const cam = this.cameras.main;
      this.fogRT.clear();
      this.fogRT.fill(0x06121a, 0.93);
      this.fogRT.erase("foghole", this.player.x - cam.scrollX - 160, this.player.y - cam.scrollY - 160);
    }
    if(this.gt > this.nextHudAt){ this.nextHudAt = this.gt + 0.2; updateHUD(); }
  }

  /* ===================== MOVIMIENTO CON COLISIÓN POR TILES ===================== */
  tileTypeAt(px,py){
    const tx = Math.floor(px/TILE), ty = Math.floor(py/TILE);
    if(tx<0||ty<0||tx>=GW||ty>=GH) return "rock";
    return this.grid[ty][tx];
  }
  isWalk(px,py){
    const tx = Math.floor(px/TILE), ty = Math.floor(py/TILE);
    if(tx<0||ty<0||tx>=GW||ty>=GH) return false;
    const type = this.grid[ty][tx];
    if(!TT[type].walk) return false;
    const ds = this.decayState[tx+","+ty];
    if(ds && ds.sunkUntil > this.gt) return false;   // tablón hundido
    return true;
  }
  canStand(px,py){
    const r = 9;
    return this.isWalk(px-r,py-r) && this.isWalk(px+r,py-r) && this.isWalk(px-r,py+r) && this.isWalk(px+r,py+r);
  }
  movePlayer(dt){
    const k = this.keys, j = window.joyVec || {x:0,y:0};
    let dx = (k.A.isDown||k.LEFT.isDown ? -1:0) + (k.D.isDown||k.RIGHT.isDown ? 1:0) + j.x;
    let dy = (k.W.isDown||k.UP.isDown ? -1:0) + (k.S.isDown||k.DOWN.isDown ? 1:0) + j.y;
    const len = Math.hypot(dx,dy);
    if(len > 0.15){
      dx/=len; dy/=len;
      this.facing = {x:dx, y:dy};
      let spd = moveSpeed();
      if(this.gt < this.slowUntil) spd *= 0.45;      // debuff de lodo
      const nx = this.player.x + dx*spd*dt, ny = this.player.y + dy*spd*dt;
      if(this.canStand(nx, this.player.y)) this.player.x = nx;
      if(this.canStand(this.player.x, ny)) this.player.y = ny;
    }
    const tp = this.tileTypeAt(this.player.x, this.player.y);
    if(TT[tp].walk && !TT[tp].sink && !TT[tp].lethal && !TT[tp].toxup)
      this.lastSafe = {x:this.player.x, y:this.player.y};
  }

  /* ===================== EFECTOS DEL TERRENO ===================== */
  tileEffects(dt){
    const tx = Math.floor(this.player.x/TILE), ty = Math.floor(this.player.y/TILE);
    const type = this.grid[ty] ? this.grid[ty][tx] : "rock";

    // Tablones que se hunden (Nivel 1)
    if(TT[type] && TT[type].sink){
      const key = tx+","+ty;
      const ds = this.decayState[key] || (this.decayState[key] = {t:0, sunkUntil:0});
      ds.t += dt;
      if(ds.t > 0.55) this.tileImgs[ty][tx].setTint(0x996655);           // aviso visual
      if(ds.t > 1.1){
        ds.sunkUntil = this.gt + 2.5; ds.t = 0;
        this.tileImgs[ty][tx].clearTint();
        this.tileImgs[ty][tx].setTexture("t_waterdeep");
        this.time.delayedCall(2500, ()=>{
          if(this.grid[ty][tx]==="decay") this.tileImgs[ty][tx].setTexture("t_decay");
        });
        this.damagePlayer(10);
        this.player.setPosition(this.lastSafe.x, this.lastSafe.y);
      }
    }
    // limpiar temporizadores de tablones donde ya no estamos
    for(const key in this.decayState){
      const [kx,ky] = key.split(",").map(Number);
      if(kx!==tx || ky!==ty){
        const ds = this.decayState[key];
        if(ds.sunkUntil < this.gt && ds.t > 0){ ds.t = 0; this.tileImgs[ky][kx].clearTint(); }
      }
    }

    // Medidor de toxicidad (Nivel 3)
    if(this.levelN === 3){
      if(TT[type] && TT[type].toxup){
        this.toxicity = Math.min(100, this.toxicity + dt * 14 * (1 - S.up.resist*0.06));
      } else {
        this.toxicity = Math.max(0, this.toxicity - dt * 12);
      }
      if(this.toxicity >= 100) this.damagePlayer(7*dt, true);
    }

    // Charcos de azogue: daño severo inmediato
    if(TT[type] && TT[type].lethal && this.gt - this.mercHitAt > 0.8){
      this.mercHitAt = this.gt;
      this.damagePlayer(45);
      this.player.setPosition(this.lastSafe.x, this.lastSafe.y);
      this.cameras.main.shake(150, 0.01);
    }
  }

  /* ===================== COMBATE: PURIFICACIÓN ===================== */
  shootAt(wx,wy){
    this.nextShot = this.gt + 0.30;
    const useCarbonLook = (this.levelN===3);
    const p = this.projectiles.create(this.player.x, this.player.y, useCarbonLook ? "p_carbon" : "p_net").setDepth(9);
    const ang = Math.atan2(wy - this.player.y, wx - this.player.x);
    const spd = 320 * netRange();
    p.body.setVelocity(Math.cos(ang)*spd, Math.sin(ang)*spd);
    p.startX = this.player.x; p.startY = this.player.y;
    p.maxDist = 210 * netRange();
    p.setRotation(ang);
  }
  updateProjectiles(){
    this.projectiles.children.each(p=>{
      if(!p.active) return;
      if(Phaser.Math.Distance.Between(p.x,p.y,p.startX,p.startY) > p.maxDist){
        this.purifyAt(Math.floor(p.x/TILE), Math.floor(p.y/TILE), this.pr);
        p.destroy();
      }
    });
    this.enemyShots.children.each(s=>{
      if(s.active && (s.x<0||s.y<0||s.x>GW*TILE||s.y>GH*TILE)) s.destroy();
    });
  }

  /* Transición dinámica del tilemap: purifica una cuadrícula de (2r+1)² alrededor del punto */
  purifyAt(cx,cy,r=1){
    for(let y=cy-r; y<=cy+r; y++) for(let x=cx-r; x<=cx+r; x++){
      if(x<0||y<0||x>=GW||y>=GH) continue;
      const type = this.grid[y][x];
      if(!TT[type] || !TT[type].toxic) continue;
      this.grid[y][x] = TT[type].pure;
      const img = this.tileImgs[y][x];
      img.setTexture(TT[TT[type].pure].tex);
      img.setScale(0.2); img.setAlpha(0.4);
      this.tweens.add({targets:img, scale:1, alpha:1, duration:260, ease:"Back.out"});
      if(Math.random()<0.5) this.burst(img.x,img.y,TT[type].lethal?0xff6b5e:0x9fce3d,3);
      if(!TT[type].nocount){
        this.cleanupDone++;
        if(Math.random() < 0.035) this.spawnAnimal(x*TILE+16, y*TILE+16);
      }
    }
    if(!this.bossSpawned && this.cleanupPct() >= (this.L.bossPct || 60)) this.spawnBoss();
  }
  cleanupPct(){ return this.cleanupTotal ? (this.cleanupDone/this.cleanupTotal*100) : 0; }

  hitEnemy(p, e){
    if(!e.active || !p.active) return;
    p.destroy();
    this.purifyAt(Math.floor(e.x/TILE), Math.floor(e.y/TILE), this.pr);

    /* --- reglas especiales de jefes --- */
    if(e.bossType === "krakenBody" && this.boss.tentaclesLeft > 0){
      e.setTintFill(0x555555); this.time.delayedCall(80, ()=>e.clearTint());
      return;   // invulnerable hasta curar tentáculos
    }
    if(e.bossType === "dredger" && !this.boss.coreOpen){
      e.setTintFill(0x555555); this.time.delayedCall(80, ()=>e.clearTint());
      return;   // solo vulnerable con el núcleo expuesto
    }
    if(e.bossType === "amalg"){
      if(this.gt > this.boss.shieldDownUntil && this.boss.shield > 0){
        this.boss.shield -= netDmg();
        if(this.boss.shield <= 0){ this.boss.shield = 0; this.boss.shieldDownUntil = this.gt + 4; }
        e.setTintFill(0xd8dee2); this.time.delayedCall(80, ()=>e.clearTint());
        return;
      }
    }

    e.hp -= netDmg();
    e.setTintFill(0xffffff); this.time.delayedCall(80, ()=>{ if(e.active) e.clearTint(); });
    if(e.hp <= 0) this.cureEnemy(e);
  }

  cureEnemy(e){
    e.body.enable = false;
    this.tweens.add({targets:e, alpha:0, scale:1.5, duration:350, onComplete:()=>e.destroy()});
    const isBossPart = !!e.bossType;

    if(e.bossType === "tentacle"){
      this.boss.tentaclesLeft--;
      if(this.boss.tentaclesLeft <= 0) this.boss.body_.setTint(0xffaaaa); // cuerpo vulnerable
      gainXP(10); return;
    }
    if(isBossPart){ this.bossDefeatedNow(); return; }

    // recompensas por curar un enemigo normal
    const n = Phaser.Math.Between(2,3);
    for(let i=0;i<n;i++) this.dropCoin(e.x + Phaser.Math.Between(-12,12), e.y + Phaser.Math.Between(-12,12));
    if(e.cfg && e.cfg.dropSeed && Math.random() < e.cfg.dropSeed){
      S.inv.seeds++; this.floatText(e.x, e.y, "🌱");
    }
    if(Math.random() < 0.12) this.spawnAnimal(e.x, e.y);
    gainXP(12);
  }

  dropCoin(x,y){
    const c = this.add.text(x,y,"🪙",{fontSize:"16px"}).setOrigin(0.5).setDepth(8);
    this.tweens.add({targets:c, x:this.player.x, y:this.player.y, duration:420, ease:"Cubic.in",
      onComplete:()=>{ c.destroy(); S.coins++; updateHUD(); }});
  }
  floatText(x,y,msg,color){
    const tx = this.add.text(x,y,msg,{fontFamily:"'Press Start 2P',monospace",fontSize:"12px",color:color||"#ffffff",stroke:"#000",strokeThickness:4}).setOrigin(0.5).setDepth(30).setScale(0.4);
    this.tweens.add({targets:tx, scale:1.2, duration:140, yoyo:true, ease:"Back.out"});
    this.tweens.add({targets:tx, y:y-38, alpha:0, delay:200, duration:800, onComplete:()=>tx.destroy()});
  }
  burst(x,y,color=0x3ec6e0,n=8){
    for(let i=0;i<n;i++){
      const a = Math.PI*2*i/n + Math.random()*0.5, d = 14+Math.random()*22;
      const c = this.add.rectangle(x,y,5,5,color).setDepth(29);
      this.tweens.add({targets:c, x:x+Math.cos(a)*d, y:y+Math.sin(a)*d-6, alpha:0, angle:180, duration:420+Math.random()*200, onComplete:()=>c.destroy()});
    }
  }
  levelUpFX(){
    this.cameras.main.flash(300,155,107,255); this.burst(this.player.x,this.player.y,0x9b6bff,16);
    this.floatText(this.player.x,this.player.y-34,"LEVEL UP!","#f2c14e");
    const ring = this.add.circle(this.player.x, this.player.y, 12).setStrokeStyle(4, 0x9b6bff).setDepth(30);
    this.tweens.add({targets:ring, radius:70, alpha:0, duration:600, onComplete:()=>ring.destroy()});
  }

  collectTrash(tr){
    if(!tr.active) return;
    tr.destroy();
    this.cleanupDone++;
    S.coins += 2; gainXP(4);
    this.floatText(this.player.x, this.player.y-20, "+2 🪙","#f2c14e"); this.burst(tr.x,tr.y,0xf2c14e,6);
    if(!this.bossSpawned && this.cleanupPct() >= (this.L.bossPct || 60)) this.spawnBoss();
  }

  /* ===================== JUGADOR: DAÑO Y DERROTA ===================== */
  damagePlayer(dmg, raw=false){
    this.hp -= raw ? dmg : dmg * resistMult();
    if(!raw){ this.cameras.main.shake(110,0.006); this.floatText(this.player.x,this.player.y-24,"-"+Math.round(dmg*resistMult()),"#ff6b5e"); }
    if(!raw){ this.player.setTintFill(0xff6b5e); this.time.delayedCall(100, ()=>this.player.clearTint()); }
    if(this.hp <= 0){
      this.hp = 0; updateHUD();
      S.coins = Math.floor(S.coins * 0.75);
      openModal("faintModal");
    }
  }
  enemyTouch(e){
    if(!e.active || e.bossType) return;
    if(!e.nextHit) e.nextHit = 0;
    if(this.gt < e.nextHit) return;
    e.nextHit = this.gt + 0.8;
    this.damagePlayer(e.cfg.dmg);
    if(e.cfg.slow){ this.slowUntil = this.gt + 2.5; toast(t("toast.slow")); }
  }

  /* ===================== ENEMIGOS ===================== */
  spawnLogic(){
    if(this.bossDefeated) return;
    if(!this.nextSpawn) this.nextSpawn = 1;
    if(this.gt < this.nextSpawn) return;
    this.nextSpawn = this.gt + 2.6;
    this.L.enemies.forEach(cfg=>{
      const count = this.enemies.getChildren().filter(e=>e.active && e.cfg===cfg).length;
      if(count >= cfg.cap) return;
      for(let tries=0; tries<30; tries++){
        const x = Phaser.Math.Between(3,GW-4), y = Phaser.Math.Between(3,GH-4);
        const px = x*TILE+16, py = y*TILE+16;
        if(!TT[this.grid[y][x]].walk) continue;
        if(Phaser.Math.Distance.Between(px,py,this.player.x,this.player.y) < 260) continue;
        const e = this.enemies.create(px,py,cfg.tex).setDepth(6);
        e.hp = cfg.hp; e.cfg = cfg; e.teleAt = this.gt + 3;
        break;
      }
    });
  }
  updateEnemies(dt){
    this.enemies.children.each(e=>{
      if(!e.active || e.bossType || !e.cfg) return;
      if(e.cfg.tele){
        // Fantasma de Mercurio: se teletransporta cerca del jugador
        e.body.setVelocity(0,0);
        if(this.gt > e.teleAt){
          e.teleAt = this.gt + 3;
          this.tweens.add({targets:e, alpha:0, duration:200, onComplete:()=>{
            if(!e.active) return;
            const ang = Math.random()*Math.PI*2;
            e.setPosition(this.player.x + Math.cos(ang)*90, this.player.y + Math.sin(ang)*90);
            this.tweens.add({targets:e, alpha:1, duration:200});
          }});
        } else {
          const ang = Math.atan2(this.player.y-e.y, this.player.x-e.x);
          e.body.setVelocity(Math.cos(ang)*30, Math.sin(ang)*30);
        }
        return;
      }
      const d = Phaser.Math.Distance.Between(e.x,e.y,this.player.x,this.player.y);
      if(d < 420){
        const ang = Math.atan2(this.player.y-e.y, this.player.x-e.x);
        e.body.setVelocity(Math.cos(ang)*e.cfg.spd, Math.sin(ang)*e.cfg.spd);
        e.setFlipX(Math.cos(ang) < 0);
      } else e.body.setVelocity(0,0);
    });
  }

  /* ===================== FAUNA Y ECO-DEX ===================== */
  spawnAnimal(x,y){
    if(this.activeAnimals >= 2) return;
    this.activeAnimals++;
    const sp = Phaser.Math.RND.pick(this.L.animals);
    const ico = DEX_SPECIES.find(s=>s.id===sp).ico;
    const a = this.add.text(x,y,ico,{fontSize:"22px"}).setOrigin(0.5).setDepth(7);
    this.physics.add.existing(a);
    a.species = sp;
    this.animalGroup.add(a);
    a.body.setVelocity(Phaser.Math.Between(-30,30), Phaser.Math.Between(-30,30));
    this.time.addEvent({delay:1500, loop:true, callback:()=>{
      if(a.active) a.body.setVelocity(Phaser.Math.Between(-30,30), Phaser.Math.Between(-30,30));
    }});
  }
  rescueAnimal(a){
    if(!a.active) return;
    this.activeAnimals--;
    const isNew = !S.dex[a.species];
    S.dex[a.species] = true;
    this.floatText(a.x, a.y, "💚");
    a.destroy();
    gainXP(8);
    if(isNew) toast("📖 " + t("toast.rescue"));
    saveGame();
  }

  /* ===================== BIO-SEMILLAS Y CARBÓN ACTIVADO ===================== */
  plantSeed(){
    const fx = Math.abs(this.facing.x) >= Math.abs(this.facing.y) ? Math.sign(this.facing.x)||1 : 0;
    const fy = fx === 0 ? (Math.sign(this.facing.y)||1) : 0;
    let tx = Math.floor(this.player.x/TILE) + fx, ty = Math.floor(this.player.y/TILE) + fy;
    if(!this.grid[ty] || this.grid[ty][tx] !== "mudflow"){ 
      if(S.inv.seeds<=0) toast("🌱 " + t("toast.seed"));
      return;
    }
    if(S.inv.seeds <= 0){ toast("🌱 " + t("toast.seed")); return; }
    S.inv.seeds--;
    let steps = 0;
    while(this.grid[ty] && this.grid[ty][tx] === "mudflow" && steps < 4){
      this.grid[ty][tx] = "bridge";
      const img = this.tileImgs[ty][tx];
      img.setTexture("t_bridge"); img.setScale(0.2);
      this.tweens.add({targets:img, scale:1, duration:300, ease:"Back.out"});
      tx += fx; ty += fy; steps++;
    }
    toast(t("toast.bridge"));
    updateHUD(); saveGame();
  }

  carbonBurst(){
    if(S.inv.carbon <= 0){ toast("🧪 " + t("toast.carbon")); return; }
    S.inv.carbon--;
    this.toxicity = 0;
    const ctx = Math.floor(this.player.x/TILE), cty = Math.floor(this.player.y/TILE);
    this.purifyAt(ctx, cty, 2);   // limpia un área de 5x5
    const ring = this.add.circle(this.player.x, this.player.y, 16).setStrokeStyle(6, 0x9fce3d).setDepth(30);
    this.tweens.add({targets:ring, radius:110, alpha:0, duration:500, onComplete:()=>ring.destroy()});
    this.enemies.children.each(e=>{
      if(!e.active) return;
      const d = Phaser.Math.Distance.Between(e.x,e.y,this.player.x,this.player.y);
      if(e.bossType === "amalg" && d < 160){
        this.boss.shield = 0; this.boss.shieldDownUntil = this.gt + 4;
        this.floatText(e.x, e.y-40, "💥");
        return;
      }
      if(!e.bossType && d < 110){ e.hp -= 50; if(e.hp<=0) this.cureEnemy(e); }
    });
    updateHUD(); saveGame();
  }

  /* ===================== JEFES ===================== */
  spawnBoss(){
    this.bossSpawned = true;
    bossBanner(this.levelN);
    const [bx,by] = this.L.boss;
    const px = bx*TILE, py = by*TILE;
    this.boss = {shots:0};

    if(this.levelN === 1){
      const body = this.enemies.create(px,py,"b_kraken").setDepth(7).setScale(1.4);
      body.bossType = "krakenBody"; body.hp = 120; body.body.setImmovable(true);
      this.boss.body_ = body; this.boss.tentaclesLeft = 4; this.boss.nextThrow = this.gt+2;
      this.boss.tentacles = [[-80,-50],[80,-50],[-80,50],[80,50]].map(off=>{
        const tnt = this.enemies.create(px+off[0], py+off[1], "b_tentacle").setDepth(7);
        tnt.bossType = "tentacle"; tnt.hp = 40; tnt.body.setImmovable(true);
        this.tweens.add({targets:tnt, y:tnt.y-8, duration:700, yoyo:true, repeat:-1, ease:"Sine.inOut"});
        return tnt;
      });
    }
    if(this.levelN === 2){
      const body = this.enemies.create(px,py,"b_dredger").setDepth(7).setScale(1.3);
      body.bossType = "dredger"; body.hp = 160; body.body.setImmovable(true);
      this.boss.body_ = body; this.boss.dir = 1; this.boss.nextWave = this.gt+3; this.boss.coreOpen = false; this.boss.coreUntil = 0;
    }
    if(this.levelN === 3){
      const body = this.enemies.create(px,py,"b_amalg").setDepth(7).setScale(1.3);
      body.bossType = "amalg"; body.hp = 180; body.body.setImmovable(true);
      this.boss.body_ = body; this.boss.shield = 60; this.boss.shieldDownUntil = 0; this.boss.nextVolley = this.gt+3;
      this.boss.ring = this.add.circle(px,py,52).setStrokeStyle(4, 0xd8dee2).setDepth(8);
    }
  }

  updateBoss(dt){
    if(!this.boss || this.bossDefeated) return;
    const b = this.boss, body = b.body_;
    if(!body || !body.active) return;

    if(body.bossType === "krakenBody"){
      // Los tentáculos vivos lanzan escombros al jugador
      if(this.gt > b.nextThrow){
        b.nextThrow = this.gt + 1.8;
        const alive = b.tentacles.filter(tn=>tn.active);
        if(alive.length){
          const tnt = Phaser.Math.RND.pick(alive);
          const s = this.enemyShots.create(tnt.x, tnt.y, "p_debris").setDepth(8);
          const ang = Math.atan2(this.player.y-tnt.y, this.player.x-tnt.x);
          s.body.setVelocity(Math.cos(ang)*190, Math.sin(ang)*190);
          s.dmg = 12;
        }
      }
    }

    if(body.bossType === "dredger"){
      // Patrulla vertical
      body.y += b.dir * 45 * dt;
      if(body.y < 13*TILE) b.dir = 1;
      if(body.y > 19*TILE) b.dir = -1;
      if(b.coreOpen && this.gt > b.coreUntil){ b.coreOpen = false; body.clearTint(); }
      if(this.gt > b.nextWave && !b.coreOpen){
        b.nextWave = this.gt + 3.4;
        // Ondas de choque en 3 filas: telegrafiar y luego dañar
        const prow = Math.floor(this.player.y/TILE);
        const rows = [prow-2, prow, prow+2].filter(r=>r>1 && r<GH-1);
        rows.forEach(r=>{
          const rect = this.add.rectangle(GW*TILE/2, r*TILE+16, GW*TILE, TILE, 0xff6b5e, 0.30).setDepth(20);
          this.tweens.add({targets:rect, alpha:0.6, duration:750, onComplete:()=>{
            const pr = Math.floor(this.player.y/TILE);
            if(rows.includes(pr)) this.damagePlayer(18);
            this.cameras.main.shake(120, 0.006);
            this.tweens.add({targets:rect, alpha:0, duration:200, onComplete:()=>rect.destroy()});
          }});
        });
        // Tras la ráfaga, el núcleo queda expuesto
        this.time.delayedCall(1100, ()=>{
          if(!body.active) return;
          b.coreOpen = true; b.coreUntil = this.gt + 2.5;
          body.setTint(0xffee66);
        });
      }
    }

    if(body.bossType === "amalg"){
      // Persigue lentamente y regenera su escudo líquido
      const ang = Math.atan2(this.player.y-body.y, this.player.x-body.x);
      body.x += Math.cos(ang)*42*dt; body.y += Math.sin(ang)*42*dt;
      if(this.gt > b.shieldDownUntil) b.shield = Math.min(60, b.shield + 8*dt);
      b.ring.setPosition(body.x, body.y);
      b.ring.setAlpha(this.gt < b.shieldDownUntil ? 0.08 : 0.25 + 0.6*(b.shield/60));
      if(this.gt > b.nextVolley){
        b.nextVolley = this.gt + 3.5;
        for(let i=-1;i<=1;i++){
          const s = this.enemyShots.create(body.x, body.y, "p_mercshot").setDepth(8);
          const a2 = ang + i*0.28;
          s.body.setVelocity(Math.cos(a2)*170, Math.sin(a2)*170);
          s.dmg = 14;
        }
      }
    }
  }

  bossDefeatedNow(){
    this.bossDefeated = true;
    S.coins += 40; gainXP(60);
    if(this.boss && this.boss.ring) this.boss.ring.destroy();
    if(this.boss && this.boss.tentacles) this.boss.tentacles.forEach(tn=>tn.active && tn.destroy());
    this.enemyShots.clear(true, true);
    const [bx,by] = this.L.boss;
    this.purifyAt(bx, by, 4);
    this.cameras.main.flash(500, 62, 198, 224);

    // OnBossDefeat: insight temático del nivel, luego resultados
    const map = {1:1, 2:3, 3:2};
    let ins = map[this.levelN];
    if(S.insightsSeen.includes(ins)) ins = nextUnseenInsight();
    window.pendingResults = true;
    if(ins) showInsight(ins);
    else { window.pendingResults = false; showResults(); }
  }
}

/* =====================================================================
   10. FLUJO ENTRE NIVELES (resultados → tienda → siguiente)
   ===================================================================== */
function showResults(){
  const gs = window.GS;
  const pct = Math.floor(gs.cleanupPct());
  let badge = "none", ico = "—";
  if(pct >= 100){ badge="gold"; ico="🥇"; }
  else if(pct >= 85){ badge="silver"; ico="🥈"; }
  else if(pct >= 70){ badge="bronze"; ico="🥉"; }
  if(badge !== "none"){
    const order = {none:0, bronze:1, silver:2, gold:3};
    if(order[badge] > (order[S.badges[gs.levelN]]||0)) S.badges[gs.levelN] = badge;
  }
  $("resBadge").textContent = ico;
  $("resText").textContent = t("res.text").replace("{p}",pct).replace("{b}",t("badge."+badge));
  openModal("resultsModal");
  saveGame();
}

$("btnResOk").onclick = ()=>{
  closeModal("resultsModal");
  if(window.GS.levelN < 3){ buildShop(); openModal("shopModal"); }
  else showVictory();
};
$("btnShopNext").onclick = ()=>{
  closeModal("shopModal");
  S.currentLevel = Math.min(3, window.GS.levelN + 1);
  saveGame();
  window.GS.scene.restart({level:S.currentLevel});
};
function showVictory(){
  const found = Object.keys(S.dex).length;
  $("vicBadges").innerHTML = [1,2,3].map(n=>{
    const b = S.badges[n];
    return `<span class="badge">${b==="gold"?"🥇":b==="silver"?"🥈":b==="bronze"?"🥉":"⬜"}</span>`;
  }).join("");
  $("vicText").textContent = t("vic.text").replace("{l}",S.plvl).replace("{a}",found);
  openModal("victoryModal");
}
$("btnReplay").onclick = ()=>{
  const lang = LANG;
  S = DEFAULT_STATE(); S.lang = lang; saveGame();
  closeModal("victoryModal");
  window.GS.scene.restart({level:1});
};

/* ============ 11. EVENTOS DE INTERFAZ ============ */
$("btnInsOk").onclick = ()=>{
  if(window.insQueue.length){ renderInsight(window.insQueue.shift()); return; }
  closeModal("insightModal");
  if(window.pendingResults){ window.pendingResults = false; showResults(); }
};
$("btnTutOk").onclick = ()=> closeModal("tutorialModal");
$("btnFaintOk").onclick = ()=>{
  const gs = window.GS;
  gs.hp = maxHP(); gs.toxicity = 0;
  gs.player.setPosition(gs.L.spawn[0]*TILE+16, gs.L.spawn[1]*TILE+16);
  gs.lastSafe = {x:gs.player.x, y:gs.player.y};
  closeModal("faintModal"); updateHUD(); saveGame();
};
$("btnDex").onclick = ()=>{ buildDex(); openModal("dexModal"); };
$("btnDexClose").onclick = ()=> closeModal("dexModal");
$("btnLang").onclick = ()=>{ LANG = LANG==="en" ? "es" : "en"; applyLang(); saveGame(); };
$("btnMenu").onclick = ()=>{
  $("btnContinue").style.display = window.PHASER_GAME ? "inline-block" : "none";
  openModal("menuModal");
};
$("btnStart").onclick = async ()=>{
    const lang = LANG;
    S = DEFAULT_STATE(); S.lang = lang;
    const btn = $("btnStart");
    if(btn) btn.disabled = true;

    if(!window.Phaser){
      if(btn) btn.textContent = "CARGANDO... / LOADING...";
      const ok = await waitForPhaser(8000);
      if(!ok){
        if(btn){
          btn.disabled = false;
          btn.textContent = "EMPEZAR / START";
        }
        alert("No se pudo cargar el motor del juego. Conecta el celular a Internet y vuelve a intentarlo.");
        return;
      }
    }

    closeModal("menuModal");
    try{
      bootGame(true);
      if(btn){ btn.disabled = false; btn.textContent = t("menu.start"); }
    }catch(err){
      console.error(err);
      if(btn){
        btn.disabled = false;
        btn.textContent = "EMPEZAR / START";
      }
      openModal("menuModal");
      alert("Hubo un error al iniciar el juego. Recarga la página e inténtalo de nuevo.");
    }
  };

  function waitForPhaser(timeout=8000){
    return new Promise(resolve=>{
      if(window.Phaser){ resolve(true); return; }
      const started = Date.now();
      const timer = setInterval(()=>{
        if(window.Phaser){
          clearInterval(timer);
          resolve(true);
        }else if(Date.now()-started >= timeout){
          clearInterval(timer);
          resolve(false);
        }
      },100);
    });
  }
$("btnContinue").onclick = async ()=>{
    if(!window.Phaser){
      const ok = await waitForPhaser(8000);
      if(!ok){
        alert("No se pudo cargar el motor del juego. Conecta el celular a Internet y vuelve a intentarlo.");
        return;
      }
    }
    closeModal("menuModal");
    try{ bootGame(false); }
    catch(err){ console.error(err); openModal("menuModal"); alert("No se pudo continuar el juego."); }
  };

function bootGame(fresh){
  if(!window.PHASER_GAME){
    window.PHASER_GAME = new Phaser.Game({
      type: Phaser.AUTO, parent: "game",
      width: 960, height: 600,
      pixelArt: true, backgroundColor: "#0b1c26",
      physics: {default:"arcade", arcade:{debug:false}},
      scale: {mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH},
      scene: [Boot, World]
    });
  } else if(fresh || window.GS.levelN !== S.currentLevel){
    window.GS.scene.restart({level:S.currentLevel});
  }
  saveGame();
}

/* ============ 12. CONTROLES TÁCTILES ============ */
window.joyVec = {x:0,y:0};
(function(){
  const joy = $("joy"), knob = $("joyKnob");
  let active = false;
  function setKnob(dx,dy){ knob.style.left = (38+dx*34)+"px"; knob.style.top = (38+dy*34)+"px"; }
  function handle(ev){
    const r = joy.getBoundingClientRect();
    const touch = ev.touches ? ev.touches[0] : ev;
    let dx = (touch.clientX - (r.left+60))/50, dy = (touch.clientY - (r.top+60))/50;
    const len = Math.hypot(dx,dy);
    if(len>1){ dx/=len; dy/=len; }
    window.joyVec = {x:dx, y:dy}; setKnob(dx,dy);
  }
  joy.addEventListener("touchstart", e=>{ active=true; handle(e); e.preventDefault(); }, {passive:false});
  joy.addEventListener("touchmove", e=>{ if(active) handle(e); e.preventDefault(); }, {passive:false});
  joy.addEventListener("touchend", ()=>{ active=false; window.joyVec={x:0,y:0}; setKnob(0,0); });

  $("tFire").addEventListener("touchstart", e=>{
    e.preventDefault();
    const gs = window.GS; if(!gs || window.gamePaused) return;
    // apunta al enemigo más cercano; si no hay, dispara al frente
    let best=null, bd=400;
    gs.enemies.children.each(en=>{
      if(!en.active) return;
      const d = Phaser.Math.Distance.Between(en.x,en.y,gs.player.x,gs.player.y);
      if(d<bd){ bd=d; best=en; }
    });
    if(best) gs.shootAt(best.x, best.y);
    else gs.shootAt(gs.player.x + gs.facing.x*100, gs.player.y + gs.facing.y*100);
  }, {passive:false});
  $("tCarb").addEventListener("touchstart", e=>{ e.preventDefault(); if(window.GS && !window.gamePaused) window.GS.carbonBurst(); }, {passive:false});
  $("tSeed").addEventListener("touchstart", e=>{ e.preventDefault(); if(window.GS && !window.gamePaused) window.GS.plantSeed(); }, {passive:false});
})();

/* ============ 13. ARRANQUE ============ */
(function init(){
  const hasSave = loadGame();
  if(hasSave){
    $("btnContinue").style.display = "inline-block";
  }
  applyLang();
})();
</script>
